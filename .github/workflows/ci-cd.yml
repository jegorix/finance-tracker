name: CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR (skip tests)
        run: ./mvnw -B -DskipTests package

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FRONT-END

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FRONT-END/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, test-backend]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Build backend Docker image
        run: docker build -t finance-tracker-backend:ci .

      - name: Validate docker compose config
        run: docker compose config

  deploy:
    name: Deploy (PaaS)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    timeout-minutes: 10

    steps:
      - name: Trigger deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_URL is missing"
            exit 1
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"

  healthcheck:
    name: Healthcheck
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: [deploy]
    timeout-minutes: 15

    steps:
      - name: Wait and check health endpoint
        env:
          APP_HEALTHCHECK_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
        run: |
          if [ -z "${APP_HEALTHCHECK_URL}" ]; then
            echo "Secret APP_HEALTHCHECK_URL is missing"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS "${APP_HEALTHCHECK_URL}" >/dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            echo "Attempt ${attempt}/30: not healthy yet"
            sleep 10
          done

          echo "Healthcheck failed"
          exit 1
