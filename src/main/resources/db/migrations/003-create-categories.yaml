databaseChangeLog:
  - changeSet:
      id: 003-create-categories
      author: ekuzm
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_categories_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX uk_categories_user_name_ci
                ON categories (user_id, LOWER(name));
