databaseChangeLog:
  - changeSet:
      id: 014-set-null-transaction-budget-on-budget-delete
      author: codex
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE transactions
                ALTER COLUMN budget_id DROP NOT NULL;

              ALTER TABLE transactions
                DROP CONSTRAINT IF EXISTS fk_transactions_budget;

              ALTER TABLE transactions
                ADD CONSTRAINT fk_transactions_budget
                FOREIGN KEY (budget_id)
                REFERENCES budgets (id)
                ON DELETE SET NULL
                ON UPDATE CASCADE;
