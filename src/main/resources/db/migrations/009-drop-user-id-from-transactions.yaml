databaseChangeLog:
  - changeSet:
      id: 009-drop-user-id-from-transactions
      author: ekuzm
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE transactions DROP CONSTRAINT IF EXISTS fk_transactions_account_user;
              ALTER TABLE transactions DROP CONSTRAINT IF EXISTS fk_transactions_budget_user;
              ALTER TABLE transactions DROP CONSTRAINT IF EXISTS fk_transactions_user;
              ALTER TABLE transactions DROP COLUMN IF EXISTS user_id;
