databaseChangeLog:
  - changeSet:
      id: 002-create-budgets
      author: ekuzm
      changes:
        - createTable:
            tableName: budgets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_budgets
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: limit_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: budgets
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_budgets_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - addUniqueConstraint:
            tableName: budgets
            columnNames: id, user_id
            constraintName: uk_budgets_id_user
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              ALTER TABLE budgets
                ADD CONSTRAINT ck_budgets_limit_non_negative CHECK (limit_amount >= 0);

              ALTER TABLE budgets
                ADD CONSTRAINT ck_budgets_period_valid CHECK (period_end >= period_start);

              CREATE UNIQUE INDEX uk_budgets_user_name_ci
                ON budgets (user_id, LOWER(name));
