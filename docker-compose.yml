services:
  db:
    image: postgres:16-alpine
    container_name: finance-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finance_tracker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - finance-tracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-finance_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-finance_tracker}
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./FRONT-END
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONT_API_BASE_URL:-http://localhost:8080}
    container_name: finance-tracker-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONT_PORT:-5173}:80"

volumes:
  finance-tracker-db-data:
